name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile (syntax check)
        working-directory: backend
        run: python -m compileall -q app
      - name: Verify migrations build a fresh DB
        working-directory: backend
        run: alembic -x db_url="sqlite:///ci_check.db" upgrade head
      - name: Tests
        working-directory: backend
        run: pytest -q || echo "no tests / non-blocking"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        working-directory: frontend
        run: npm run lint || echo "lint warnings (non-blocking)"
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8001
