# Local prod-like stack: Postgres + API + frontend.
# Usage:  docker compose up --build
# This mirrors a real deployment (Postgres, migrations on boot, gunicorn) so
# you can validate prod config locally. The GPU avatar pipeline is NOT here —
# set AVATAR_MODE=runpod (cloud) or run pifuhd_server.py on a GPU host.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitcheck
      POSTGRES_PASSWORD: fitcheck
      POSTGRES_DB: fitcheck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://fitcheck:fitcheck@db:5432/fitcheck
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_BASE_URL: http://localhost:8001
      CORS_ORIGINS: '["http://localhost:3000"]'
      AVATAR_MODE: ${AVATAR_MODE:-runpod}
      LOCAL_INFERENCE_URL: ${LOCAL_INFERENCE_URL:-}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      # Storage: default local disk (volume below); set STORAGE_BACKEND=s3 + S3_* for prod
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - storage:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8001
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage:
